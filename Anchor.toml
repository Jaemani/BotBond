[toolchain]
anchor_version = "1.1.2"

[features]
resolution = true
skip-lint = false

[programs.devnet]
botbond = "HoamYxgGuZoQerLGthZK8K4vLKTvEraZ4o7N8fkjk4bc"

[programs.localnet]
botbond = "EG9rKPV69v3WNX7aVchAPonMtKPp6yML7jZwDjMKaRKR"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "./node_modules/.bin/ts-mocha -p ./tsconfig.json -t 1000000 tests/botbond.test.ts tests/bond-adapter.test.ts tests/adapter-contract-rehearsal.test.ts && ANCHOR_PROVIDER_URL=$ANCHOR_PROVIDER_URL ANCHOR_WALLET=$ANCHOR_WALLET ./node_modules/.bin/tsx apps/gateway/scripts/e2e-solana.ts"

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "127.0.0.1"
ledger = ".anchor/test-ledger"
rpc_port = 8900
