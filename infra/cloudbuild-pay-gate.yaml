steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/pay-gate/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/pay-gate:${_IMAGE_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/pay-gate:${_IMAGE_TAG}
substitutions:
  _REGION: us-central1
  _IMAGE_TAG: manual
