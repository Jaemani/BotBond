substitutions:
  _REGION: us-central1
  _IMAGE_TAG: manual

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "services/intent-agent/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/intent-agent:${_IMAGE_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/gateway/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/gateway:${_IMAGE_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/web/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/web:${_IMAGE_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "services/pay-gate/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/pay-gate:${_IMAGE_TAG}", "."]

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/intent-agent:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/gateway:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/web:${_IMAGE_TAG}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/botbond/pay-gate:${_IMAGE_TAG}"
