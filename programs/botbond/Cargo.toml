[package]
name = "botbond"
version = "0.1.0"
description = "BotBond refundable agent bond escrow (hackathon MVP)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "botbond"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
