[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botbond-intent-agent"
version = "0.1.0"
description = "BotBond least-privilege intent compiler"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
vertex = ["google-cloud-aiplatform>=1.71,<2"]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
